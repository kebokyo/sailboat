[package]
name = "sailboat"
version = "0.1.0"
description = "A TUI & CLI client for plane.so"
license = "CDDL"
edition = "2024"
rust-version = "1.95.0"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dotenvy = "0.15.7"
htmd = "0.5.5"
http = "1.5.0"
pulldown-cmark = "0.13.4"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1.19"
toml = "1.1.4"
uuid = { version = "1.26.0", features = ["serde", "v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
